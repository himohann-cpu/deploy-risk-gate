# Move this file to .github/workflows/ci.yml
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Gate eval on simulated rollouts
        run: python -m deploy_gate eval >> "$GITHUB_STEP_SUMMARY"
      - name: Risk of this pull request
        if: github.event_name == 'pull_request'
        run: >
          python -m deploy_gate assess
          --base "origin/${{ github.base_ref }}" --service deploy-risk-gate
          >> "$GITHUB_STEP_SUMMARY"
